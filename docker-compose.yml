# Local stack: agent + Postgres. `docker compose up`, then
#   curl -X POST -H "Authorization: Bearer $API_TOKEN" localhost:8080/jobs/poll-mailbox
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ap
      POSTGRES_PASSWORD: ap
      POSTGRES_DB: ap
    volumes: [pgdata:/var/lib/postgresql/data]
  agent:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ap:ap@db:5432/ap
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  pgdata:
