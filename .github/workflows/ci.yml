name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" ruff pip-audit
      - run: ruff check src tests --select E,F,W --ignore E501
      - run: pytest -q
      - run: pip-audit --strict --skip-editable

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [gcp, aws, azure]
    defaults:
      run:
        working-directory: deploy/terraform/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate

  image:
    runs-on: ubuntu-latest
    needs: [test, terraform]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ap-agent:ci
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ap-agent:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          sbom: true
          provenance: true
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
