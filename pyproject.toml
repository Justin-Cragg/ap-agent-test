[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-agent"
version = "0.1.0"
description = "Cloud-agnostic accounts-payable AI agent (Claude) with ERP and mailbox connectors"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.12,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pyjwt[crypto]>=2.8",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "alembic>=1.13",
  "prometheus-client>=0.20",
  "cryptography>=42",
]

[project.optional-dependencies]
# LLM provider SDK extras
bedrock = ["anthropic[bedrock]>=2.12,<3"]
vertex = ["anthropic[vertex]>=2.12,<3"]
# Mailbox auth
gmail = ["google-auth>=2.30", "requests>=2.31"]
outlook = ["msal>=1.28"]
# Blob storage / database drivers per cloud
aws = ["boto3>=1.34", "psycopg[binary]>=3.1"]
gcp = ["google-cloud-storage>=2.16", "google-cloud-secret-manager>=2.20", "psycopg[binary]>=3.1"]
azure = ["azure-storage-blob>=12.20", "azure-identity>=1.16", "azure-keyvault-secrets>=4.8", "psycopg[binary]>=3.1"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25", "opentelemetry-instrumentation-fastapi>=0.46b0", "opentelemetry-instrumentation-httpx>=0.46b0"]
all = ["ap-agent[bedrock,vertex,gmail,outlook,aws,gcp,azure,otel]"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
ap-agent = "ap_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ap_agent = ["migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: runs against live ERP/mail sandboxes (needs credentials)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 200
target-version = "py311"
